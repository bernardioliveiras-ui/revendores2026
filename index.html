<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <title>MIX10 PRO | Suporte para Articulações, Mobilidade e Qualidade de Vida</title>
    <meta name="description" content="MIX10 PRO reúne 10 ativos poderosos para suas articulações, músculos e mobilidade. Fórmula premium com Colágeno Tipo II, Condroitina, Cúrcuma, MSM, Vitaminas e Minerais." />
    <!-- Admin Internal Mode Block -->
    <script>
      (function() {
        var cookies = document.cookie.split('; ');
        var isAdmin = cookies.some(function(item) { return item.trim().indexOf('admin_logged_in=true') === 0; });
        if (isAdmin) {
          window.isInternalMode = true;
          // Block Meta Pixel
          window.fbq = function() {
            console.log("[Internal Mode - Admin] Intercepted fbq tracking event:", arguments);
          };
          window._fbq = window.fbq;
          
          // Block Google Analytics/Ads
          window.gtag = function() {
            console.log("[Internal Mode - Admin] Intercepted gtag tracking event:", arguments);
          };
          window.ga = function() {
            console.log("[Internal Mode - Admin] Intercepted ga tracking event:", arguments);
          };
          
          // Block TikTok Pixel
          window.ttq = {
            track: function() { console.log("[Internal Mode - Admin] Intercepted ttq.track:", arguments); },
            page: function() { console.log("[Internal Mode - Admin] Intercepted ttq.page:", arguments); },
            load: function() { console.log("[Internal Mode - Admin] Intercepted ttq.load:", arguments); }
          };
        }
      })();
    </script>
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '992776610153750');
      fbq('set', 'autoConfig', false, '992776610153750');

      // SISTEMA DE TESTE A/B DE LANDING PAGES
      (function() {
        try {
          if (sessionStorage.getItem('checkout_active') === 'true') {
            console.log('[A/B Test] Checkout active, skipping redirection.');
            return;
          }
        } catch (e) {
          console.error('[A/B Test] Error accessing sessionStorage:', e);
        }

        function getCookie(name) {
          var value = "; " + document.cookie;
          var parts = value.split("; " + name + "=");
          if (parts.length === 2) return parts.pop().split(";").shift();
          return null;
        }
        function setCookie(name, val, days) {
          var date = new Date();
          date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
          var expires = "; expires=" + date.toUTCString();
          document.cookie = name + "=" + val + expires + "; path=/; SameSite=Lax";
        }

        var currentPath = window.location.pathname;
        var urlParams = new URLSearchParams(window.location.search);
        var abDebug = urlParams.get('ab_debug');

        // 1. Processar parâmetro de debug (?ab_debug=original ou ?ab_debug=v2 ou ?ab_debug=v3)
        if (abDebug === 'original' || abDebug === 'v2' || abDebug === 'v3') {
          setCookie('lp_version', abDebug, 30);
          localStorage.setItem('lp_version', abDebug);
        }

        var lpVersion = getCookie('lp_version') || localStorage.getItem('lp_version');

        // 2. Aplicar sorteio e redirecionamento apenas na Home (evitando checkout, obrigado, admin e APIs)
        var isHome = currentPath === "/" || currentPath === "/index.html";

        if (isHome) {
          if (!lpVersion) {
            // SPLIT DE TESTE A/B: 50% para v3, 25% para v2, 25% para original.
            var rand = Math.random();
            if (rand < 0.50) {
              lpVersion = 'v3';
            } else if (rand < 0.75) {
              lpVersion = 'v2';
            } else {
              lpVersion = 'original';
            }
            
            setCookie('lp_version', lpVersion, 30);
            localStorage.setItem('lp_version', lpVersion);
          }

          if (lpVersion === 'v2') {
            window.location.replace("/lp-v2" + window.location.search);
          } else if (lpVersion === 'v3') {
            window.location.replace("/lp-v3" + window.location.search);
          }
        } else if (currentPath === "/lp-v2") {
          // Se acessar a rota /lp-v2 diretamente, forçar a versão para v2 sem redirecionar
          if (lpVersion !== 'v2') {
            lpVersion = 'v2';
            setCookie('lp_version', lpVersion, 30);
            localStorage.setItem('lp_version', lpVersion);
          }
        } else if (currentPath === "/lp-v3") {
          // Se acessar a rota /lp-v3 diretamente, forçar a versão para v3 sem redirecionar
          if (lpVersion !== 'v3') {
            lpVersion = 'v3';
            setCookie('lp_version', lpVersion, 30);
            localStorage.setItem('lp_version', lpVersion);
          }
        }
      })();
    </script>
    <!-- End Meta Pixel Code -->
  </head>

    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=992776610153750&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
