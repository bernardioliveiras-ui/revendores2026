    .table th{background:#fdfcf9;color:#7b7f83}.table td{color:#435568}.table .namecell{color:#112a42}.table tbody tr:hover{background:#fffcf5}
    .table .rank{background:#eef2f6;color:#274d6b}.table .rank.top{background:#fff0cb;color:#89611b}
    .activity .adot{background:#cba25c;box-shadow:0 0 0 5px #fff4e0}.activity b{color:var(--forest)}.activity p{color:#526579}
    .step:not(:last-child):before{border-color:#e3d7bd}.step .stepico{background:#fff3d8;color:#a77a2e}
    .filethumb{background:linear-gradient(135deg,#f8f0dd,#ecdbb8);color:#a67838}.filethumb.video{background:linear-gradient(135deg,#e9eff7,#cedcec);color:#476c92}
    .field label{color:#263d51}.field input,.field select,.field textarea{border-color:#e5dfd4}
    .previewcard{background:linear-gradient(145deg,#091e31,#23435b)}.previewcard p{color:#e5e8eb}.previewcard .cta{background:#e6c17e;color:#4d3417}
    .version .vico{background:#fff3dc;color:#a47b35}.modaloverlay{background:#071725aa}.modalfoot{background:#fdfcf9}.toast{background:#0c2d46;box-shadow:0 15px 38px #10233944}
    @media(max-width:980px){.overlaymobile{background:#061b2d99}}
    .preview-rolebar{background:#fff;border-bottom:1px solid var(--line);padding:12px 34px;display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap}
    .preview-rolebar p{margin:0;color:#607384;font-size:12px}.preview-rolebar p strong{color:#0b2d45}
    .role-switch{display:flex;gap:5px;padding:4px;border-radius:11px;background:#f2f1ed;border:1px solid #e8e2d8}
    .role-switch button{border:0;background:transparent;color:#5c6b7a;border-radius:8px;min-height:35px;padding:7px 15px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:760}
    .role-switch button.active{background:#0b2d45;color:#fff;box-shadow:0 2px 7px #10283b1e}.role-switch button.active svg{color:#f0ce8b}
    .portal-action-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.portal-action{background:#fff;border:1px solid #e5dfd5;border-radius:14px;padding:20px;text-align:left;display:flex;align-items:flex-start;gap:13px;box-shadow:0 5px 17px #17283b09}.portal-action:hover{border-color:#d4ac62;background:#fffdf8}.portal-action .picon{background:#fff1d5;color:#986c29;border-radius:10px;padding:11px;display:grid;place-items:center}.portal-action b{display:block;color:#0b2d45;font-size:13px;margin:3px 0 6px}.portal-action span{color:#788491;font-size:11px;line-height:1.5}
    .portal-split{display:grid;grid-template-columns:1.3fr .8fr;gap:18px}.profile-greet{display:flex;align-items:center;gap:12px}.profile-greet .user-photo{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#f0d7a0;color:#422e11;font-weight:800}
    .delivery-card{padding:24px}.delivery-card .order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.delivery-card .order-top h2{font-size:19px;color:#0d2b43;margin:0 0 6px}.delivery-card .order-top small{color:#7d8991}
    .tracking-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0 22px}.tracking-steps .track-step{border-top:3px solid #dee3e6;padding-top:13px;color:#82919f;font-size:11px}.tracking-steps .track-step.done{border-color:#c59a53;color:#1e4159}.tracking-steps .track-step b{display:block;font-weight:800;margin-bottom:5px}.track-status{border:1px solid #efe1c4;background:#fffaf0;padding:15px;border-radius:11px;font-size:12px;line-height:1.7;color:#75552e}
    .portal-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid #eee9e1}.portal-item:last-child{border-bottom:0}.portal-item b{font-size:12px;color:#18364f}.portal-item small{display:block;color:#7d8a97;margin-top:5px;font-size:11px}.portal-item .amount{font-weight:800;font-size:13px;color:#0e314b;white-space:nowrap}
    .portal-campaign{background:linear-gradient(115deg,#fefbf4,#fff);border:1px solid #e5d8ba;border-radius:15px;padding:24px}.portal-campaign h2{font-size:21px;color:#0a2b44;margin:6px 0 8px}.portal-campaign .campaign-url{display:block;border:1px solid #e5dfd3;background:white;color:#496477;padding:13px;border-radius:9px;overflow-wrap:anywhere;font-size:12px;margin:15px 0}.portal-campaign .campaign-buttons{display:flex;gap:9px;flex-wrap:wrap}
    .portal-note{padding:16px;border:1px solid #f0dfb8;border-radius:12px;background:#fffbf2;color:#745528;font-size:12px;line-height:1.65}.portal-note b{display:block;color:#664516;margin-bottom:5px}.portal-note p{margin:0}.portal-materials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.portal-material{padding:18px;display:flex;align-items:flex-start;gap:14px}.portal-material .fileicon{background:#fff2d7;border-radius:10px;color:#986b2c;padding:12px}.portal-material h3{font-size:13px;margin:1px 0 6px;color:#12344d}.portal-material p{font-size:11px;color:#778593;line-height:1.5;margin:0 0 12px}
    @media(max-width:1100px){.portal-split{grid-template-columns:1fr}.portal-action-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){.preview-rolebar{padding:12px 16px;gap:10px}.preview-rolebar p{font-size:11px}.role-switch{width:100%}.role-switch button{flex:1;justify-content:center;padding:8px 6px;font-size:11px}.portal-action-grid,.portal-materials{grid-template-columns:1fr}.tracking-steps{gap:4px}.tracking-steps .track-step{font-size:10px}}
  </style>

  function materialsView(){const list=materials.filter(m=>S.materialTarget==='all'||m.target===S.materialTarget||m.target==='both');return`${head('Biblioteca comercial','Materiais','Tudo organizado por público, formato e campanha.',`<button class="btn primary" onclick="openUpload()">${I('plus')} Novo material demo</button>`)}<div class="toolbar"><button class="btn ${S.materialTarget==='all'?'primary':''}" onclick="S.materialTarget='all';render()">Todos</button><button class="btn ${S.materialTarget==='reseller'?'primary':''}" onclick="S.materialTarget='reseller';render()">Revendedores</button><button class="btn ${S.materialTarget==='influencer'?'primary':''}" onclick="S.materialTarget='influencer';render()">Influenciadores</button></div><div class="grid three">${list.map(m=>`<article class="box material"><div class="filethumb ${m.kind}">${I(fileIcon(m.kind),45)}</div><div style="display:flex;gap:6px;margin-bottom:10px"><span class="pill">${m.kind.toUpperCase()}</span><span class="pill gray">${targetLabel(m.target)}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p><div class="filemeta"><span>${m.size}</span><span>${datebr(m.date)}</span></div><div class="actions"><button class="btn tiny" onclick="openMaterial(${m.id})">${I('eye',13)} Visualizar</button><button class="btn tiny" onclick="toast('Download demonstrativo: arquivo fictício')">${I('download',13)} Baixar</button><button class="btn tiny" onclick="toast('WhatsApp simulado: nenhuma mensagem enviada')">${I('link',13)} Compartilhar</button></div></article>`).join('')}</div>`}
  function settingsView(){return`${head('Governança & segurança','Configurações e Auditoria','Regras financeiras preservadas e operações sensíveis rastreáveis.',`<span class="demo-ribbon">${I('shield',13)} Política V2 desligada</span>`)}<div class="grid two"><div class="box boxpad"><div class="section-title"><div><h2>Regras da plataforma</h2><p>Somente leitura na demonstração</p></div>${I('shield',20)}</div><div class="listline"><div class="circle">${I('check',18)}</div><div class="linetxt"><b>Asaas como fonte de pagamento</b><small>Não aprovar pedidos por ação administrativa artificial</small></div><span class="pill">Obrigatório</span></div><div class="listline"><div class="circle">${I('clock',18)}</div><div class="linetxt"><b>Cashback V2 · R$ 20 por caixa</b><small>Exige aceite dos termos e homologação, ainda não ativado</small></div><span class="pill red">Desligado</span></div><div class="listline"><div class="circle">${I('wallet',18)}</div><div class="linetxt"><b>Carteira de revendedores</b><small>Regra atual preservada, separada dos influenciadores</small></div><span class="pill gray">Protegida</span></div><div class="listline"><div class="circle">${I('shield',18)}</div><div class="linetxt"><b>Permissões de acesso</b><small>BKO, revendedor e influenciador com escopos próprios</small></div><span class="pill">Ativo</span></div></div><div class="box boxpad"><div class="section-title"><div><h2>Auditoria operacional</h2><p>Exemplos fictícios de eventos, sem histórico real</p></div><span class="pill gray">Mock</span></div>${events.map(e=>`<div class="activity"><div class="adot ${e.kind==='amber'?'amber':''}"></div><div><p><b>${esc(e.who)}</b> · ${esc(e.what)}</p><small>${esc(e.date)}</small></div></div>`).join('')}<div class="signal mt">${I('alert',18)}<div><b>Auditoria persistente Asaas pendente</b><p>Schema separado e homologação MySQL ainda precisam ser autorizados.</p></div></div></div></div><div class="box boxpad mtlg"><div class="section-title"><div><h2>Ambiente demonstrativo</h2><p>Este painel foi criado separadamente do CRM atual</p></div></div><div class="grid three">${metric('Asaas real','OFF','Nenhuma chamada externa','shield')}${metric('MySQL real','OFF','Nenhuma escrita em banco','shield')}${metric('Mensagens reais','OFF','WhatsApp / e-mail desativados','shield')}</div></div>`}
  function renderNav(){document.getElementById('navigation').innerHTML=(roleNav[S.role]||nav).map(n=>`<button class="navbtn ${S.view===n[0]?'active':''}" onclick="go('${n[0]}')" aria-current="${S.view===n[0]?'page':'false'}">${I(n[2],18)}<span class="navtext">${n[1]}</span>${S.view===n[0]?I('chevron',13):''}</button>`).join('')}
  function render(){renderNav();document.getElementById('breadcrumb').textContent=activeLabel();document.title=`${activeLabel()} | LORD NUTRI — Prévia`;document.querySelector('.brand small').textContent=S.role==='admin'?'Backoffice Pro':S.role==='reseller'?'Portal do Revendedor':'Portal do Influenciador';document.querySelector('.navlabel').textContent=S.role==='admin'?'Plataforma':'Meu portal';document.querySelector('.avatar b').textContent=S.role==='admin'?'Admin Lord Nutri':S.role==='reseller'?res[0].name:inf[0].name;document.querySelector('.avatar small').textContent=S.role==='admin'?'BKO · demonstração':S.role==='reseller'?'Revendedor · demonstração':'Influenciador · demonstração';document.querySelectorAll('[data-role]').forEach(b=>{const a=b.dataset.role===S.role;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a))});const pages={overview,influencers,resellers,shipping,orders:ordersView,studio:studioView,materials:materialsView,settings:settingsView};document.getElementById('view').innerHTML=S.role==='admin'?(pages[S.view]||overview)():typeof window.renderRole==='function'?window.renderRole():`<div class="box boxpad">Carregando prévia do perfil...</div>`;}
  function switchRole(role){if(!roleNav[role]||S.role===role)return;S.role=role;S.view=roleNav[role][0][0];S.search='';S.page=1;S.period='7';closeModal();toggleMenu(false);render();window.scrollTo({top:0,behavior:'smooth'})}
  function go(view){S.view=view;S.page=1;S.search='';S.sort='sales';toggleMenu(false);render();window.scrollTo({top:0,behavior:'smooth'})}
  function toggleMenu(open){S.menu=open;document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('overlaymobile').classList.toggle('show',open)}
  function toast(msg,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=msg;document.getElementById('toastroot').replaceChildren(el);clearTimeout(S.noticeTimer);S.noticeTimer=setTimeout(()=>el.remove(),3700)}
  function modal(title,subtitle,body,foot='',wide=false){document.getElementById('modalroot').innerHTML=`<div class="modaloverlay" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="iconbtn" aria-label="Fechar" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div>${foot?`<div class="modalfoot">${foot}</div>`:''}</div></div>`;document.querySelector('.modal .iconbtn')?.focus()}
  function closeModal(){document.getElementById('modalroot').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  function profile(id){const p=inf.find(x=>x.id===id)||res.find(x=>x.id===id);if(!p)return;const influencer=id.startsWith('inf');modal('Perfil · '+p.name,'Dados e histórico simulados do usuário',`<div class="formrow"><div class="field"><label>Nome completo</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>Status</label><select id="pstatus"><option ${p.status==='ativo'?'selected':''}>ativo</option><option ${p.status==='inativo'?'selected':''}>inativo</option></select></div><div class="field"><label>E-mail</label><input value="${esc(p.email)}" disabled></div><div class="field"><label>${influencer?'Campanha':'Cidade'}</label><input value="${esc(influencer?p.campaign:p.city)}" disabled></div></div><div class="sep"></div><div class="signal green">${I('shield',17)}<div><b>Informações demonstrativas</b><p>Nenhuma alteração será enviada para usuários ou banco real.</p></div></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProfile('${p.id}')">${I('check',15)} Salvar demo</button>`)}
  function saveProfile(id){const p=[...inf,...res].find(x=>x.id===id);if(!p)return;p.name=document.getElementById('pname').value.trim()||p.name;p.status=document.getElementById('pstatus').value;closeModal();render();toast('Perfil atualizado somente nesta demonstração')}
  function newInfluencer(){modal('Novo influenciador','Cadastro local e fictício',`<div class="formrow"><div class="field"><label>Nome</label><input id="nname" placeholder="Nome completo"></div><div class="field"><label>Campanha</label><input id="ncamp" placeholder="EXEMPLO"></div></div><p class="hint mt">O link da campanha será demonstrativo e não capturará dados reais.</p>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="addInfluencer()">Criar demo</button>`)}
  function addInfluencer(){const n=document.getElementById('nname').value.trim(),c=document.getElementById('ncamp').value.trim();if(!n||!c)return toast('Preencha nome e campanha',true);const slug=c.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!slug||inf.some(x=>x.slug===slug))return toast('Slug inválido ou já utilizado',true);inf.push({id:'inf'+Date.now(),name:n,campaign:c.toUpperCase(),slug,instagram:'',tiktok:'',phone:'',email:'novo@example.test',status:'ativo',notes:'',clicks:0,leads:0});closeModal();render();toast('Influenciador criado apenas na prévia')}
  function openSale(){modal('Registrar venda · demonstração','O estoque é validado localmente antes do registro.',`<div class="formrow"><div class="field"><label>Revendedor</label><select id="saleRes">${res.filter(r=>r.status==='ativo').map(r=>`<option value="${r.id}">${esc(r.name)} · ${r.stock} caixas</option>`).join('')}</select></div><div class="field"><label>Quantidade de caixas</label><input type="number" min="1" step="1" id="saleBoxes" value="1"></div><div class="field"><label>Nome do cliente</label><input id="saleClient" placeholder="Cliente fictício"></div><div class="field"><label>Preço por caixa (R$)</label><input id="salePrice" type="number" step="0.01" min="0.01" value="109.90"></div></div><div class="field mt"><label>Observação opcional</label><textarea id="saleObs" placeholder="Observação de demonstração"></textarea></div><p class="hint mt">Sem cobrança, sem movimentação real e sem persistência após recarregar a página.</p>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveSale()">${I('check',15)} Registrar venda demo</button>`)}
  function saveSale(){const r=res.find(x=>x.id===document.getElementById('saleRes').value),q=Number(document.getElementById('saleBoxes').value),name=document.getElementById('saleClient').value.trim(),price=Number(document.getElementById('salePrice').value);if(!r||!Number.isInteger(q)||q<1||q>r.stock||!name||!Number.isFinite(price)||price<=0)return toast('Confira cliente, preço, quantidade e estoque disponível',true);r.stock-=q;orders.unshift({id:'LNT-DEMO-'+Math.floor(Math.random()*9999),name:r.name,channel:'reseller',owner:r.id,client:name,date:ago(0),boxes:q,total:Math.round(price*100)*q,status:'paid',verified:true,access:true,ship:'separating',last:ago(0),track:'DEMO-LOCAL'});closeModal();render();toast(`${q} caixa(s) registrada(s). Estoque demo atualizado para ${r.stock}.`)}
  function openTracking(id){const o=orders.find(x=>x.id===id);if(!o)return;const statuses=['separating','posted','transit','out','delivered'],idx=statuses.indexOf(o.ship);modal('Expedição · '+o.id,'Rastreamento '+o.track+' · origem: simulação local',`<div class="timeline">${statuses.map((s,i)=>`<div class="step ${idx<i?'dim':''}"><span class="stepico">${I(idx>=i?'check':'clock',14)}</span><div><b>${shipLabels[s]}</b><p>${idx>=i?'Evento demonstrativo registrado':'Aguardando atualização'}</p></div></div>`).join('')}</div><div class="field"><label>Atualizar status manualmente (demo)</label><select id="newShipping">${statuses.map(s=>`<option value="${s}" ${o.ship===s?'selected':''}>${shipLabels[s]}</option>`).join('')}</select></div><p class="hint mt">Última atualização: ${datebr(o.last)} · nenhuma consulta aos Correios.</p>`,`<button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="saveShipping('${o.id}')">Atualizar demo</button>`)}
  function saveShipping(id){const o=orders.find(x=>x.id===id);o.ship=document.getElementById('newShipping').value;o.last=ago(0);closeModal();render();toast('Status de expedição atualizado na prévia')}
  function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;modal('Pedido · '+o.id,'Linha do tempo e ações de conferência (simuladas)',`<div class="grid two"><div class="box boxpad"><div class="small muted">Cliente</div><b>${esc(o.client)}</b><p class="small muted">${esc(o.name)}</p><div class="sep"></div><div class="small muted">Valor</div><b>${brl(o.total)}</b></div><div class="box boxpad"><div class="small muted">Pagamento</div><span class="pill ${o.status==='paid'?'':'amber'}">${o.status==='paid'?'Confirmado (mock)':o.status==='pending'?'Pendente':'Cancelado'}</span><div class="sep"></div><div class="small muted">Acesso</div><span class="pill ${o.access?'':'gray'}">${o.access?'Liberado':'Não liberado'}</span></div></div><div class="signal mt">${I('shield',17)}<div><b>Asaas é a única confirmação no produto real</b><p>Esta prévia não pode marcar cobranças reais como pagas.</p></div></div>`,`<button class="btn" onclick="closeModal()">Fechar</button>${o.status==='pending'?`<button class="btn" onclick="mockCheck('${o.id}')">Consultar Asaas mock</button>`:''}${o.status==='paid'&&!o.access?`<button class="btn primary" onclick="mockAccess('${o.id}')">Liberar acesso demo</button>`:''}`)}
  function mockCheck(id){closeModal();toast('Consulta mock: pagamento ainda PENDING; nenhuma liberação efetuada')}
  function mockAccess(id){const o=orders.find(x=>x.id===id);if(!o||o.status!=='paid'||!o.verified)return toast('Liberação bloqueada: Asaas não verificado',true);o.access=true;closeModal();render();toast('Acesso fictício liberado na prévia')}
  function studioForm(){return{title:document.getElementById('sttitle').value.trim(),subtitle:document.getElementById('stsubtitle').value.trim(),cta:document.getElementById('stcta').value.trim()}}
  function saveDraft(){const d=studioForm();if(!d.title||!d.subtitle||!d.cta)return toast('Preencha os campos obrigatórios',true);studio.draft=d;toast('Rascunho salvo localmente')}
  function previewDraft(){const d=studioForm();if(!d.title||!d.subtitle||!d.cta)return toast('Preencha os campos para prévia',true);modal('Prévia antes de publicar','Textos ainda não publicados',`<div class="previewcard"><small>LORD NUTRI</small><h2>${esc(d.title)}</h2><p>${esc(d.subtitle)}</p><span class="cta">${esc(d.cta)}</span></div>`,`<button class="btn primary" onclick="closeModal()">Voltar ao editor</button>`,true)}
  function publishDraft(){const d=studioForm();if(!d.title||!d.subtitle||!d.cta)return toast('Preencha os campos obrigatórios',true);if(!confirm('Publicar versão fictícia nesta prévia? O site real NÃO será alterado.'))return;Object.assign(studio,d,{draft:null});studio.versions.unshift({date:ago(0),by:'Admin (demo)',title:'Publicação de demonstração',id:studio.versions.length+1});render();toast('Versão publicada somente na prévia')}
  function openMaterial(id){const m=materials.find(x=>x.id===id);if(!m)return;modal('Visualização · '+m.title,`${m.kind.toUpperCase()} · ${m.size} · público ${targetLabel(m.target)}`,`<div class="filethumb ${m.kind}" style="height:210px;margin:0 0 15px">${I(fileIcon(m.kind),60)}</div><p class="hint">${esc(m.desc)}</p><div class="signal green">${I('eye',17)}<div><b>Prévia ilustrativa disponível</b><p>O arquivo real não é carregado nesta demonstração.</p></div></div>`,`<button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="toast('Download simulado; nenhum arquivo externo enviado')">Baixar demo</button>`)}
  function openUpload(){modal('Adicionar material · demonstração','Arquivo local sem envio a servidor',`<div class="field"><label for="uploadFile">Selecionar PDF, imagem ou vídeo (até 150 MB)</label><input type="file" id="uploadFile" accept=".pdf,.png,.jpg,.jpeg,.webp,.mp4,.webm,application/pdf,image/png,image/jpeg,image/webp,video/mp4,video/webm"></div><div class="field mt"><label for="uploadTitle">Título</label><input id="uploadTitle" placeholder="Título do material"></div><div class="field mt"><label for="uploadTarget">Público-alvo</label><select id="uploadTarget"><option value="both">Ambos</option><option value="reseller">Revendedores</option><option value="influencer">Influenciadores</option></select></div><p class="hint mt">Prévia isolada: somente metadados em memória, sem upload nem storage real.</p>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="addMaterial()">Adicionar demo</button>`)}
  function addMaterial(){const f=document.getElementById('uploadFile').files[0],t=document.getElementById('uploadTitle').value.trim(),target=document.getElementById('uploadTarget').value;const allowed={'application/pdf':'pdf','image/png':'image','image/jpeg':'image','image/webp':'image','video/mp4':'video','video/webm':'video'};if(!f||!t)return toast('Selecione um arquivo e informe o título',true);if(f.size>150*1024*1024||!allowed[f.type])return toast('Formato inválido ou arquivo acima de 150 MB',true);materials.unshift({id:Date.now(),title:t,desc:'Material adicionado apenas na prévia',kind:allowed[f.type],target,size:(f.size/1048576).toFixed(1)+' MB',date:ago(0)});closeModal();render();toast('Material incluído somente na memória desta página')}
  async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Link de demonstração copiado')}catch{toast('Não foi possível copiar automaticamente; link: '+t)}}
  document.addEventListener('click',e=>{const role=e.target.closest('[data-role]');if(role)switchRole(role.dataset.role);const p=e.target.closest('[data-period]');if(p){S.period=p.dataset.period;S.page=1;render()}const c=e.target.closest('[data-copy]');if(c)copyText(c.dataset.copy);const pr=e.target.closest('[data-profile]');if(pr)profile(pr.dataset.profile)});
  document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){S.search=e.target.value;const field=e.target;const place=field.selectionStart;render();const next=document.querySelector('[data-search]');if(next){next.focus();next.setSelectionRange(place,place)}}});

<script>/* Prévia isolada dos portais. Nenhuma operação faz requisição a sistemas reais. */
'use strict';

const resellerSaleHistory = [
  {name:'Cliente demonstração A',boxes:2,total:21980,date:ago(2),channel:'WhatsApp'},
  {name:'Cliente demonstração B',boxes:1,total:10990,date:ago(5),channel:'Instagram'},
  {name:'Cliente demonstração C',boxes:3,total:32970,date:ago(11),channel:'Presencial'},
];
const influencerSaleHistory = [
  {id:'VENDA-DEMO-01',date:ago(3),boxes:1,total:10990,cashback:2000,status:'Aprovado'},
  {id:'VENDA-DEMO-02',date:ago(8),boxes:1,total:10990,cashback:2000,status:'Em apuração'},
];

function demoRoleNotice(){return `<div class="portal-note mtlg">${I('shield',16)} <b>Ambiente de apresentação</b><p>Dados e operações fictícios. Nenhuma alteração será enviada ao portal real, ao Asaas, aos Correios ou ao banco de dados.</p></div>`}
function demoMaterialList(role){const items=materials.filter(m=>m.target===role||m.target==='both');return `<div class="portal-materials">${items.map(m=>`<article class="box portal-material"><div class="fileicon">${I(fileIcon(m.kind),25)}</div><div style="min-width:0;flex:1"><span class="pill gray">${m.kind.toUpperCase()} · ${m.size}</span><h3>${esc(m.title)}</h3><p>${esc(m.desc)} · ${datebr(m.date)}</p><div class="actions"><button class="btn tiny" onclick="openMaterial(${m.id})">${I('eye',14)} Visualizar</button><button class="btn tiny" onclick="toast('Arquivo ilustrativo: download não disponível nesta prévia')">${I('download',14)} Baixar</button><button class="btn tiny" onclick="toast('Compartilhamento simulado: nenhuma mensagem enviada')">${I('link',14)} WhatsApp</button></div></div></article>`).join('')}</div>`}
function resellerOrders(){return orders.filter(o=>o.owner===res[0].id&&o.channel==='reseller').sort((a,b)=>b.date.localeCompare(a.date))}
function resellerPaidOrders(){return resellerOrders().filter(o=>o.status==='paid')}
function resellerSaleTotal(){return resellerSaleHistory.reduce((n,x)=>n+x.total,0)}
function resellerBoxesSold(){return resellerSaleHistory.reduce((n,x)=>n+x.boxes,0)}
function resellerHero(){return `<div class="box hero"><div class="herotext"><div class="tinylabel">PORTAL DO REVENDEDOR · LORD NUTRI</div><h2>Olá, ${esc(res[0].name.split(' ')[0])}! 👋</h2><p>Seu estoque, suas vendas e seus pedidos em um único lugar. Acompanhe a operação com tranquilidade.</p><button class="btn gold mt" onclick="go('r-sales')">${I('plus',15)} Registrar venda demo</button></div><div class="hero-side"><strong>${fmt.format(res[0].stock)}</strong><span>caixas disponíveis</span></div></div>`}
function resellerOverview(){const o=resellerPaidOrders();return `${head('Seu negócio em movimento','Visão Geral','Tudo o que você precisa acompanhar no dia a dia.',`<span class="demo-ribbon">${I('shield',14)} Perfil de exemplo</span>`)}
${resellerHero()}<div class="grid four mt">${metric('Estoque atual',`${res[0].stock} caixas`,'Disponíveis para venda','store')}${metric('Caixas vendidas',resellerBoxesSold(),'Vendas simuladas','chart')}${metric('Vendas registradas',brl(resellerSaleTotal()),'Valor ilustrativo','wallet')}${metric('Pedidos',resellerOrders().length,'Kits demonstrativos','clipboard','blue')}</div>
<div class="section-title mtlg"><div><h2>Acesso rápido</h2><p>As ações mais usadas no portal</p></div></div><div class="portal-action-grid"><button class="portal-action" onclick="go('r-stock')"><span class="picon">${I('store',20)}</span><div><b>Estoque</b><span>Saldo, movimentações e reposição</span></div></button><button class="portal-action" onclick="go('r-sales')"><span class="picon">${I('chart',20)}</span><div><b>Vendas</b><span>Registre caixas vendidas</span></div></button><button class="portal-action" onclick="go('r-orders')"><span class="picon">${I('truck',20)}</span><div><b>Pedidos</b><span>Acompanhe entrega e rastreio</span></div></button></div>
<div class="portal-split mtlg"><div>${resellerDeliveryCard(o[0])}</div><div class="box boxpad"><div class="section-title"><div><h2>Últimas vendas</h2><p>Movimentações de demonstração</p></div><button class="btn tiny" onclick="go('r-sales')">Ver todas</button></div>${resellerSaleHistory.slice(0,3).map(s=>`<div class="portal-item"><div><b>${esc(s.name)}</b><small>${s.boxes} caixa(s) · ${datebr(s.date)}</small></div><span class="amount">${brl(s.total)}</span></div>`).join('')}</div></div>${demoRoleNotice()}`}
function resellerDeliveryCard(o){if(!o)return `<div class="box boxpad"><h2>Nenhum pedido de exemplo</h2><p class="muted">Os pedidos aparecerão aqui quando disponíveis.</p></div>`;const delivered=o.ship==='delivered',shipped=['posted','transit','out','delivered'].includes(o.ship);return `<div class="box delivery-card"><div class="section-title"><div><h2>Acompanhe seu pedido</h2><p>Último evento conhecido da transportadora · simulado</p></div><span class="pill amber">${esc(shipLabels[o.ship])}</span></div><div class="order-top"><div><h2>Pedido de ${o.boxes} caixa(s)</h2><small>Pedido ${esc(o.id)} · transportadora Correios</small></div><span class="pill gray">Rastreio fictício</span></div><div class="tracking-steps"><div class="track-step done"><b>1 · Separação</b>Pedido preparado</div><div class="track-step ${shipped?'done':''}"><b>2 · Em percurso</b>${shipped?'Postagem registrada':'Aguardando postagem'}</div><div class="track-step ${delivered?'done':''}"><b>3 · Entregue</b>${delivered?'Entrega concluída':'Aguardando entrega'}</div></div><p class="small"><b>Rastreio:</b> ${esc(o.track)} <span class="muted">· Última atualização: ${datebr(o.last)}</span></p><div class="actions"><button class="btn primary" onclick="openResellerTracking('${o.id}')">${I('truck',15)} Ver rastreamento</button><button class="btn" onclick="go('r-orders')">Outros pedidos</button></div></div>`}
function openResellerTracking(id){const o=orders.find(x=>x.id===id&&x.owner===res[0].id);if(!o)return;const steps=['separating','posted','transit','out','delivered'];let reached=steps.indexOf(o.ship);modal('Rastreamento do pedido '+o.id,'Correios · código de demonstração '+o.track,`<div class="timeline">${steps.map((s,i)=>`<div class="step ${i>reached?'dim':''}"><span class="stepico">${I(i<=reached?'check':'clock',14)}</span><div><b>${esc(shipLabels[s])}</b><p>${i<=reached?'Evento ilustrativo salvo na prévia':'Aguardando nova informação'}</p></div></div>`).join('')}</div><div class="track-status"><b>Última atualização: ${datebr(o.last)}</b><div>O rastreamento real será consultado pelo servidor quando a integração oficial estiver homologada.</div></div>`,`<button class="btn primary" onclick="closeModal()">Entendi</button>`)}
function resellerManual(){return `${head('Treinamento e divulgação','Manual do Revendedor','Conteúdo para aprender, visualizar e compartilhar.',`<span class="pill">Materiais do revendedor</span>`)}<div class="box boxpad"><div class="portal-split"><div><div class="eyebrow">MANUAL LORD NUTRI</div><h2 style="font-size:22px;color:#0b2d45;margin:8px 0">Tudo para começar bem</h2><p class="muted" style="font-size:13px;line-height:1.7">Consulte orientações sobre o produto, atendimento, abordagem comercial e pós-venda. Prévia e download ficam organizados por formato.</p><button class="btn gold" onclick="openMaterial(1)">${I('eye',16)} Visualizar manual</button></div><div class="filethumb" style="height:180px;margin:0">${I('file',60)}</div></div></div><div class="section-title mtlg"><div><h2>Biblioteca do revendedor</h2><p>Apenas materiais destinados ao seu perfil</p></div></div>${demoMaterialList('reseller')}${demoRoleNotice()}`}
function resellerStock(){return `${head('Controle de produtos','Estoque','Saldo e movimentações em uma única visão.',`<button class="btn primary" onclick="toast('Reposição demonstrativa: nenhuma cobrança Asaas criada')">${I('plus',15)} Repor estoque</button>`)}<div class="grid three">${metric('Caixas disponíveis',res[0].stock,'Saldo local fictício','store')}${metric('Caixas vendidas',resellerBoxesSold(),'Vendas demonstrativas','chart')}${metric('Kits adquiridos',res[0].kits,'Histórico ilustrativo','clipboard')}</div><div class="portal-split mtlg"><div class="box boxpad"><div class="section-title"><div><h2>Movimentações do estoque</h2><p>Entradas e saídas de exemplo</p></div><span class="pill gray">Local · demo</span></div><div class="portal-item"><div><b>Entrada · KIT50</b><small>Recebimento fictício · ${datebr(ago(15))}</small></div><span class="amount">+50 caixas</span></div>${resellerSaleHistory.map(s=>`<div class="portal-item"><div><b>Venda · ${esc(s.name)}</b><small>${datebr(s.date)}</small></div><span class="amount">−${s.boxes} caixas</span></div>`).join('')}</div><div class="box boxpad"><h2 style="font-size:17px;margin:0 0 9px">Reposição inteligente</h2><p class="muted" style="font-size:12px;line-height:1.7">Quando precisar de mais produtos, você poderá escolher o kit e acompanhar o pedido. A criação de cobrança continua no fluxo real do Asaas, sem atalhos.</p><div class="track-status mt"><b>Preço de venda sugerido</b><div style="font-size:21px;color:#142e44;font-weight:850">R$ 109,90 <small style="font-size:11px">por caixa</small></div><p style="margin:0">Exemplo visual. O preço real continua validado pelo backend.</p></div><button class="btn primary mt" onclick="go('r-sales')">Registrar venda</button></div></div>${demoRoleNotice()}`}
function resellerSales(){return `${head('Registro de vendas','Vendas','Informe cliente, quantidade e preço de forma simples.',`<button class="btn primary" onclick="openResellerSale()">${I('plus',15)} Registrar nova venda</button>`)}<div class="grid three">${metric('Total vendido',brl(resellerSaleTotal()),'Exemplo acumulado','wallet')}${metric('Caixas vendidas',resellerBoxesSold(),'Exemplo acumulado','chart')}${metric('Saldo de estoque',`${res[0].stock} caixas`,'Validação simulada','store')}</div><div class="portal-split mtlg"><div class="box boxpad"><div class="section-title"><div><h2>Últimas vendas</h2><p>Histórico demonstrativo do revendedor</p></div></div><div class="tablewrap"><table class="table" style="min-width:480px"><thead><tr><th>Cliente</th><th>Qtde.</th><th>Valor</th><th>Data</th></tr></thead><tbody>${resellerSaleHistory.map(s=>`<tr><td class="namecell">${esc(s.name)}<small>${esc(s.channel)}</small></td><td>${s.boxes}</td><td>${brl(s.total)}</td><td>${datebr(s.date)}</td></tr>`).join('')}</tbody></table></div></div><div class="box boxpad"><div class="section-title"><div><h2>Registrar uma venda</h2><p>Uma experiência mais rápida</p></div></div><div class="listline"><div class="circle">${I('check',17)}</div><div class="linetxt"><b>Quantidade de caixas</b><small>Sem vender acima do saldo</small></div></div><div class="listline"><div class="circle">${I('check',17)}</div><div class="linetxt"><b>Cliente e preço</b><small>R$ 109,90 preenchidos por padrão</small></div></div><div class="listline"><div class="circle">${I('check',17)}</div><div class="linetxt"><b>Estoque atualizado</b><small>Somente neste exemplo local</small></div></div><button class="btn gold mt" onclick="openResellerSale()">${I('plus',15)} Simular venda</button></div></div>${demoRoleNotice()}`}
function openResellerSale(){modal('Registrar venda de demonstração',`Estoque fictício disponível: ${res[0].stock} caixas`,`<div class="formrow"><div class="field"><label for="rSaleBoxes">Quantidade de caixas</label><input id="rSaleBoxes" type="number" min="1" max="${res[0].stock}" step="1" value="1"></div><div class="field"><label for="rSalePrice">Preço por caixa (R$)</label><input id="rSalePrice" type="number" min="0.01" step="0.01" value="109.90"></div></div><div class="field mt"><label for="rSaleClient">Nome do cliente</label><input id="rSaleClient" maxlength="80" placeholder="Nome fictício"></div><div class="field mt"><label for="rSaleNotes">Observações (opcional)</label><textarea id="rSaleNotes" placeholder="Detalhes da venda"></textarea></div><div class="portal-note mt">A venda é apenas simulada nesta página e não afeta sua conta verdadeira.</div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveResellerSale()">Registrar venda demo</button>`)}
function saveResellerSale(){const q=Number(document.getElementById('rSaleBoxes').value),price=Number(document.getElementById('rSalePrice').value),name=document.getElementById('rSaleClient').value.trim();if(!Number.isInteger(q)||q<1||q>res[0].stock||!name||!Number.isFinite(price)||price<=0||price>1e6)return toast('Confira nome, valor e estoque disponível',true);const total=Math.round(price*100)*q;res[0].stock-=q;resellerSaleHistory.unshift({name,boxes:q,total,date:ago(0),channel:'Demo'});closeModal();render();toast('Venda fictícia registrada e estoque demo atualizado!')}
function resellerOrdersPage(){const entries=resellerOrders();return `${head('Entregas e rastreamento','Meus Pedidos','Acompanhe o último status informado de cada encomenda.',`<span class="pill amber">Rastreio demonstrativo</span>`)}<div class="grid three">${metric('Meus pedidos',entries.length,'Pedidos ilustrativos','clipboard')}${metric('Em percurso',entries.filter(o=>['posted','transit','out'].includes(o.ship)).length,'Último status conhecido','truck')}${metric('Entregues',entries.filter(o=>o.ship==='delivered').length,'Entregas de exemplo','check')}</div><div class="mtlg">${entries.length?resellerDeliveryCard(entries.find(o=>o.status==='paid')||entries[0]):''}</div><div class="box boxpad mtlg"><div class="section-title"><div><h2>Histórico de pedidos</h2><p>Visão compacta com status e código de rastreio</p></div></div>${entries.slice(0,8).map(o=>`<div class="portal-item"><div><b>${esc(o.id)} · ${o.boxes} caixa(s)</b><small>${datebr(o.date)} · ${esc(o.track)}</small></div><div class="actions"><span class="pill ${o.status==='paid'?'':'amber'}">${o.status==='paid'?esc(shipLabels[o.ship]):'Aguardando pagamento'}</span>${o.status==='paid'?`<button class="btn tiny" onclick="openResellerTracking('${o.id}')">${I('eye',14)} Ver</button>`:''}</div></div>`).join('')}</div>${demoRoleNotice()}`}
function resellerReferrals(){return `${head('Rede de contatos','Indicações','Acompanhe suas indicações de forma organizada.',`<span class="pill gray">Exemplo visual</span>`)}<div class="grid three">${metric('Indicações realizadas',7,'Registros demonstrativos','users')}${metric('Novos contatos',4,'Aguardando retorno','clock')}${metric('Conversões',3,'Atribuição fictícia','check')}</div><div class="box boxpad mtlg"><div class="section-title"><div><h2>Indicações recentes</h2><p>Sem expor informações sensíveis</p></div></div>${[['Contato demonstrativo 01','Convertido',2],['Contato demonstrativo 02','Em andamento',4],['Contato demonstrativo 03','Novo contato',6]].map(v=>`<div class="portal-item"><div><b>${v[0]}</b><small>${datebr(ago(v[2]))}</small></div><span class="pill ${v[1]==='Convertido'?'':'amber'}">${v[1]}</span></div>`).join('')}</div>${demoRoleNotice()}`}

function influencerHero(){return `<div class="box hero"><div class="herotext"><div class="tinylabel">PORTAL DO INFLUENCIADOR · LORD NUTRI</div><h2>Olá, ${esc(inf[0].name.split(' ')[0])}! ✨</h2><p>Sua campanha, suas conversões e o acompanhamento do cashback em um só lugar.</p><button class="btn gold mt" onclick="go('i-campaigns')">${I('link',15)} Minha campanha TORREI</button></div><div class="hero-side"><strong>TORREI</strong><span>campanha ativa · demo</span></div></div>`}
function influencerPolicyNote(){return `<div class="portal-note mtlg"><b>${I('shield',14)} Regra financeira V2 não ativada</b><p>Os valores apresentados nesta prévia são apenas exemplos do futuro layout, não saldos devidos. A política planejada de R$ 20 por caixa, prazo de 30 dias, mês seguinte e mínimo de R$ 100 exige publicação, aceite dos termos e homologação antes de entrar em vigor. A regra atual do sistema não foi alterada.</p></div>`}
function influencerOverview(){return `${head('Seu desempenho','Visão Geral','Acompanhe o alcance da campanha e as vendas atribuídas.',`<span class="pill">Campanha TORREI</span>`)}${influencerHero()}<div class="grid four mt">${metric('Cliques no link',fmt.format(inf[0].clicks),'Visitas fictícias','link')}${metric('Entrantes / leads',fmt.format(inf[0].leads),'Contatos ilustrativos','users')}${metric('Vendas confirmadas','2','Pedidos de exemplo','check')}${metric('Cashback apurado',brl(4000),'Projeção fictícia, não liberada','wallet')}</div><div class="grid three mt">${metric('Cashback aprovado',brl(2000),'Exemplo de estado separado','check')}${metric('Disponível para repasse',brl(0),'Nenhum repasse real','clock','amber')}${metric('Cashback pago',brl(0),'Nenhum pagamento efetuado','wallet')}</div><div class="portal-split mtlg"><div>${influencerCampaignCard()}</div><div class="box boxpad"><div class="section-title"><div><h2>Resumo da campanha</h2><p>Indicadores ilustrativos</p></div></div><div class="portal-item"><div><b>Cliques no link</b></div><span class="amount">${fmt.format(inf[0].clicks)}</span></div><div class="portal-item"><div><b>Vendas confirmadas</b></div><span class="amount">2</span></div><div class="portal-item"><div><b>Conversão estimada</b></div><span class="amount">${pct(2/inf[0].clicks*100)}</span></div><button class="btn primary mt" onclick="go('i-cashback')">Ver vendas e cashback</button></div></div>${influencerPolicyNote()}`}
function influencerCampaignCard(){const p=inf[0],link=`https://exemplo.test/${p.slug}`;return `<div class="portal-campaign"><div class="eyebrow">SUA CAMPANHA</div><h2>${esc(p.campaign)}</h2><p class="muted" style="font-size:12px">Compartilhe seu link e acompanhe os resultados em um só lugar.</p><span class="campaign-url">${esc(link)}</span><p class="hint">Link ilustrativo: o endereço real não é ativado nesta prévia.</p><div class="campaign-buttons"><button class="btn primary" data-copy="${esc(link)}">${I('copy',15)} Copiar link demo</button><button class="btn" onclick="toast('WhatsApp demonstrativo: nenhuma mensagem enviada')">${I('link',15)} Compartilhar no WhatsApp</button></div></div>`}
function influencerCampaigns(){return `${head('Divulgação e atribuição','Campanhas e Links','Compartilhe sem precisar lidar com códigos técnicos.',`<span class="pill">Campanha ativa · demo</span>`)}<div class="portal-split"><div>${influencerCampaignCard()}</div><div class="grid two" style="align-content:start">${metric('Cliques',fmt.format(inf[0].clicks),'Acesso pelo link','link')}${metric('Leads',fmt.format(inf[0].leads),'Entrantes de exemplo','users')}${metric('Vendas',2,'Confirmadas fictícias','check')}${metric('Valor gerado',brl(21980),'Produtos ilustrativos','chart')}</div></div><div class="box boxpad mtlg"><div class="section-title"><div><h2>Como funciona o link</h2><p>Um nome simples para compartilhar</p></div></div><div class="listline"><div class="circle">${I('link',17)}</div><div class="linetxt"><b>Campanha: TORREI</b><small>Slug público amigável; identificação interna preservada na aplicação real</small></div></div><div class="listline"><div class="circle">${I('chart',17)}</div><div class="linetxt"><b>Origem registrada</b><small>Cliques e vendas atribuídas são apresentados em um histórico claro</small></div></div><div class="listline"><div class="circle">${I('shield',17)}</div><div class="linetxt"><b>Sem dados sensíveis expostos</b><small>O identificador técnico não aparece na experiência pública</small></div></div></div>${demoRoleNotice()}`}
function influencerCashback(){return `${head('Transparência financeira','Vendas e Cashback','Apuração, aprovação, liberação e pagamento em estados distintos.',`<span class="demo-ribbon">${I('clock',14)} Valores fictícios</span>`)}<div class="grid four">${metric('Vendas confirmadas','2','Pedidos fictícios verificados','check')}${metric('Cashback apurado',brl(4000),'Projeção de exemplo','wallet')}${metric('Cashback aprovado',brl(2000),'Exemplo de aprovação','check')}${metric('Disponível / pago',`${brl(0)} / ${brl(0)}`,'Sem movimentação real','clock','amber')}</div><div class="box boxpad mtlg"><div class="section-title"><div><h2>Histórico de vendas atribuídas</h2><p>Pedidos distintos, sem expor clientes</p></div><span class="pill gray">Simulação</span></div><div class="tablewrap"><table class="table" style="min-width:620px"><thead><tr><th>Venda</th><th>Data</th><th>Caixas</th><th>Valor da venda</th><th>Cashback ilustrativo</th><th>Estado</th></tr></thead><tbody>${influencerSaleHistory.map(s=>`<tr><td class="namecell">${esc(s.id)}</td><td>${datebr(s.date)}</td><td>${s.boxes}</td><td>${brl(s.total)}</td><td>${brl(s.cashback)}</td><td><span class="pill ${s.status==='Aprovado'?'':'amber'}">${esc(s.status)}</span></td></tr>`).join('')}</tbody></table></div></div><div class="portal-split mtlg"><div class="box boxpad"><div class="section-title"><div><h2>Etapas do cashback</h2><p>Para evitar confusão entre saldos</p></div></div>${[['1','Apurado','Venda verificada, valor calculado'],['2','Aprovado','Crédito revisado e aprovado'],['3','Liberado','Cumpriu as regras de elegibilidade'],['4','Pago','Transferência registrada']].map(x=>`<div class="listline"><div class="circle" style="font-weight:800">${x[0]}</div><div class="linetxt"><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div><div class="box boxpad"><h2 style="font-size:16px;margin:0 0 10px">Previsão de pagamento</h2><p class="muted" style="font-size:12px;line-height:1.7">A data real depende das regras publicadas, do aceite dos termos e da aprovação dos créditos. Este painel não gera repasses.</p><div class="track-status"><b>Mínimo previsto: R$ 100,00</b><div>Prazo planejado: após 30 dias, no mês seguinte. Ainda não ativado.</div></div></div></div>${influencerPolicyNote()}`}
function influencerMaterials(){return `${head('Conteúdo para divulgar','Materiais','Encontre o conteúdo publicado para seu perfil.',`<span class="pill gray">Biblioteca demo</span>`)}<div class="box boxpad"><div class="eyebrow">CENTRAL DE CRIATIVOS</div><h2 style="font-size:22px;color:#0b2d45;margin:5px 0 10px">Divulgue com mais facilidade</h2><p class="muted" style="font-size:12px;line-height:1.6">Cards, imagens, vídeos e PDFs organizados por campanha. Prévia, compartilhamento e download no mesmo lugar.</p></div><div class="section-title mtlg"><div><h2>Materiais disponíveis</h2><p>Somente os destinados a influenciadores</p></div></div>${demoMaterialList('influencer')}${demoRoleNotice()}`}
function influencerProfile(){const p=inf[0];return `${head('Minha conta','Meu Perfil','Seus dados de divulgação organizados e protegidos.',`<span class="pill">Conta ativa · demo</span>`)}<div class="portal-split"><div class="box boxpad"><div class="profile-greet"><div class="user-photo">MC</div><div><h2 style="margin:0 0 5px;font-size:17px">${esc(p.name)}</h2><span class="muted" style="font-size:11px">Influenciadora · ${esc(p.campaign)}</span></div></div><div class="sep"></div><div class="grid two"><div class="field"><label>Nome completo</label><input value="${esc(p.name)}" readonly></div><div class="field"><label>E-mail</label><input value="${esc(p.email)}" readonly></div><div class="field"><label>Instagram</label><input value="${esc(p.instagram)}" readonly></div><div class="field"><label>TikTok</label><input value="@exemplo" readonly></div></div><p class="hint mt">Os dados acima são inteiramente fictícios. Edição financeira exige autenticação e autorização no sistema verdadeiro.</p></div><div class="box boxpad"><h2 style="font-size:17px;margin:0 0 14px">Campanha vinculada</h2><div class="portal-item"><div><b>Nome</b></div><span class="pill">${esc(p.campaign)}</span></div><div class="portal-item"><div><b>Status</b></div><span class="pill">Ativo</span></div><div class="portal-item"><div><b>Link</b><small>Identificador interno não exibido</small></div><button class="btn tiny" onclick="go('i-campaigns')">Ver link</button></div><div class="track-status mt">Dados bancários e CPF não são exibidos nesta visualização.</div></div></div>${demoRoleNotice()}`}

window.renderRole=function renderRole(){
  const resellerViews={'r-overview':resellerOverview,'r-manual':resellerManual,'r-stock':resellerStock,'r-sales':resellerSales,'r-orders':resellerOrdersPage,'r-referrals':resellerReferrals};
  const influencerViews={'i-overview':influencerOverview,'i-campaigns':influencerCampaigns,'i-cashback':influencerCashback,'i-materials':influencerMaterials,'i-profile':influencerProfile};
  const views=S.role==='reseller'?resellerViews:influencerViews;
  return (views[S.view]||Object.values(views)[0])();
};
</script>
<script>const requestedProfile=new URLSearchParams(location.search).get("perfil"); if (["reseller","influencer"].includes(requestedProfile)) switchRole(requestedProfile);</script>
